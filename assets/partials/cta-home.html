<section id="cta-home" class="section-standard bg-slate-900/10" data-component="cta" aria-labelledby="cta-home-heading">
    <div class="section-container">
        <div class="contact-surface-gradient cta-panel relative overflow-hidden rounded-large p-8 md:p-12 lg:p-14 text-center reveal">
            <div class="aric absolute inset-0 m-auto w-full h-full bg-luxus-green/10 rounded-full -z-10" aria-hidden="true"></div>
            <div class="relative z-10 max-w-4xl mx-auto">
                <div class="pill-kicker mx-auto justify-center mb-5">
                    <span class="text-[13px] text-accent-luxus font-bold uppercase tracking-widest">PRIMER PASO</span>
                </div>
                <h2 id="cta-home-heading" class="section-title text-accent-luxus mb-5" data-cta-field="title">Comunicación con criterio.</h2>
                <p class="section-description mx-auto mb-8" data-cta-field="description">Conversemos sobre el contexto, los riesgos y las oportunidades de comunicación de su organización.</p>
                <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                    <a href="contacto.html" class="btn-primary w-full sm:w-auto" data-cta-field="primary">SOLICITAR REUNIÓN</a>
                    <a href="nosotros.html" class="btn-secondary w-full sm:w-auto" data-cta-field="secondary">CONOCER LUXUS</a>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    /* Cards de soluciones: recupera la lectura fotográfica sin sacrificar contraste. */
    .partial-service-card:before {
        background: linear-gradient(0deg, rgba(0, 0, 0, .72) 0%, rgba(0, 0, 0, .18) 62%, rgba(0, 0, 0, 0) 100%);
    }
    .partial-service-card .luxus-card-bg {
        opacity: .34;
        filter: grayscale(100%) saturate(.82) contrast(1.02);
    }
    .partial-service-card:hover .luxus-card-bg,
    .partial-service-card:focus-within .luxus-card-bg {
        opacity: .46;
        filter: grayscale(12%) saturate(.96) contrast(1.04);
    }
    .partial-service-card .luxus-icon-container,
    .partial-service-card .partial-service-title,
    .partial-service-card a {
        text-shadow: 0 2px 12px rgba(0, 0, 0, .72);
    }

    /* Timeline / cards horizontales: scroll táctil real en mobile. */
    #services-carousel-container,
    .methodology-snap-carousel,
    #servicesCarousel {
        touch-action: pan-x pinch-zoom;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }
    #services-carousel-container::-webkit-scrollbar,
    .methodology-snap-carousel::-webkit-scrollbar,
    #servicesCarousel::-webkit-scrollbar {
        display: none;
    }
    @media (max-width: 767px) {
        #services-carousel-container > article,
        .methodology-snap-carousel > * {
            scroll-snap-align: center;
        }
    }
</style>

<script>
(() => {
    const path = window.location.pathname;
    const isHome = /(?:^|\/)index\.html$|\/$/.test(path);
    const isNosotros = /\/nosotros\.html$/.test(path);
    const isServicios = /\/servicios\.html$/.test(path);

    if (isHome) {
        const kicker = document.querySelector('#hero .pill-kicker h2');
        const title = document.querySelector('#hero h1');
        const clientsLink = document.querySelector('.home-insight-card:nth-of-type(2) .home-insight-link');
        const faq = document.querySelector('#faq-placeholder');

        if (kicker) kicker.textContent = 'CONSULTORES EN MENDOZA';
        if (title) title.innerHTML = 'Comunicación con criterio estratégico';
        if (clientsLink) {
            clientsLink.href = 'servicios.html#clientes';
            const label = clientsLink.querySelector('span:not([aria-hidden])');
            if (label) label.textContent = 'VER CASOS DE ÉXITO';
        }
        if (faq) faq.remove();
    }

    if (isNosotros) {
        const heroTitle = document.querySelector('.luxus-hero .hero-title');
        const hero = document.querySelector('.luxus-hero');
        const breadcrumb = document.getElementById('breadcrumb-placeholder');
        if (heroTitle) heroTitle.textContent = 'Visibilidad para construir confianza.';
        if (hero && breadcrumb && !hero.querySelector('.luxus-hero .pill-kicker')) {
            const kicker = document.createElement('div');
            kicker.className = 'pill-kicker mx-auto justify-center mb-5';
            kicker.innerHTML = '<span class="text-[13px] text-accent-luxus font-bold uppercase tracking-widest">Arquitectura Narrativa</span>';
            breadcrumb.insertAdjacentElement('afterend', kicker);
        }
    }

    if (isServicios) {
        const clientsSection = document.getElementById('sectores');
        if (clientsSection && !clientsSection.id.includes('clientes')) clientsSection.id = 'clientes';
        if (window.location.hash === '#clientes' && clientsSection) {
            requestAnimationFrame(() => clientsSection.scrollIntoView({ behavior: 'smooth', block: 'start' }));
        }
    }

    const initHorizontalDrag = (selector) => {
        document.querySelectorAll(selector).forEach((container) => {
            if (container.dataset.horizontalDragInitialized === 'true') return;
            container.dataset.horizontalDragInitialized = 'true';

            let startX = 0;
            let startScrollLeft = 0;
            let dragging = false;

            container.addEventListener('pointerdown', (event) => {
                if (event.pointerType === 'mouse') return;
                startX = event.clientX;
                startScrollLeft = container.scrollLeft;
                dragging = true;
            }, { passive: true });

            container.addEventListener('pointermove', (event) => {
                if (!dragging || event.pointerType === 'mouse') return;
                const delta = event.clientX - startX;
                if (Math.abs(delta) > 4) container.scrollLeft = startScrollLeft - delta;
            }, { passive: true });

            ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
                container.addEventListener(type, () => { dragging = false; }, { passive: true });
            });
        });
    };

    initHorizontalDrag('#services-carousel-container, .methodology-snap-carousel, #servicesCarousel');
})();
</script>
