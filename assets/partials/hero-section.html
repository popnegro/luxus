<!--
  Canonical Luxus hero contract
  -----------------------------
  Required structure (pages may inline the same classes when content is unique):
    section.luxus-hero
      [.luxus-hero-blob]
      .section-container
        .pill-kicker  → label only (typography comes from CSS)
        h1.hero-title
        [p.hero-lede]
        .btn-primary + .btn-secondary
        [.hero-proof-strip]

  Accent in titles: use text-luxus-blue (never text-accent-luxus-blue).
  Pill labels: no ad-hoc text-[11px] / tracking-* — .pill-kicker owns type.
-->
<section class="luxus-hero" data-component="hero">
    <div aria-hidden="true" class="luxus-hero-blob"></div>
    <div class="section-container relative z-10">
        <div class="max-w-4xl text-center mx-auto reveal">
            <div class="pill-kicker mx-auto justify-center mb-6">
                <span>Luxus Consultores</span>
            </div>
            <h1 class="hero-title mx-auto mb-8 text-balance">
                Comunicación con <span class="text-luxus-blue">criterio</span> estratégico.
            </h1>
            <p class="hero-lede mx-auto">
                Consultora de comunicación institucional, relaciones con medios y posicionamiento estratégico.
            </p>
            <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="contacto.html" class="btn-primary w-full sm:w-auto">Agendar consulta</a>
                <a href="servicios.html" class="btn-secondary w-full sm:w-auto">Explorar servicios <span aria-hidden="true" class="ml-2">&rarr;</span></a>
            </div>
            <div class="hero-proof-strip mx-auto justify-center"></div>
        </div>
    </div>
</section>
